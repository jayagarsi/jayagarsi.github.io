{% extends "base.html" %}
{% block title %}Projects — {{ config.title }}{% endblock %}
{% block content %}
  <h1>Projects</h1>
  <div class="project-grid">
  {% for page in section.pages %}
    <a href="{{ page.permalink }}" class="project-card">
      {% if page.extra.image %}
        <img src="{{ page.extra.image }}" alt="{{ page.title }}">
      {% endif %}
      <h2>{{ page.title }}</h2>
      <p>{{ page.description }}</p>
    </a>
  {% endfor %}
  </div>
{% endblock %}
