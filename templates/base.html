<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ get_url(path="style.css") }}">
  <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
</head>
<body data-theme="light">
  <div class="page-card">
    <nav>
      <a href="{{ get_url(path="@/_index.md") }}">Home</a>
      <!-- <a href="{{ get_url(path="@/about.md")}}">About</a> -->
      <a href="{{ get_url(path="@/cv.md") }}">CV</a>
      <a href="{{ get_url(path="@/projects/_index.md") }}">Projects</a>
      <button id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
    </nav>
    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="{{ get_url(path="theme.js") }}"></script>
  <script src="{{ get_url(path="regex-demo/regex_engine.js") }}"></script>
  <script src="{{ get_url(path="regex-demo/regex_demo.js") }}"></script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: true, theme: 'dark' });
  </script>
</body>
</html>
