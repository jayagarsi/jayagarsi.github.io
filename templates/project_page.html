{% extends "base.html" %}
{% block title %}{{ page.title }} — {{ config.title }}{% endblock %}
{% block content %}
  <h1>{{ page.title }}</h1>
  {{ page.content | safe }}
  {% if page.extra.repo_url %}
    <p><a href="{{ page.extra.repo_url }}" target="_blank" rel="noopener noreferrer">View on GitHub</a></p>
  {% endif %}
{% endblock %}
