{% extends "base.html" %}
{% block title %}Try the Interpreter — {{ config.title }}{% endblock %}
{% block content %}

<h1>{{ page.title }}</h1>
{{ page.content | safe }}

<div id="status">Loading interpreter...</div>

<textarea id="code-input" rows="12" placeholder="write your program here"></textarea>
<br>
<button id="run-btn" disabled>Run</button>

<div id="error-output"></div>
<audio id="output-audio" controls style="display:none; margin-top: 16px;"></audio>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.0/full/pyodide.js"></script>
<script src="{{ get_url(path="interpreter-runner.js") }}"></script>

<!-- {% if page.extra.repo_url %}
    <p><a href="{{ page.extra.repo_url }}">View on GitHub</a></p>
{% endif %} -->
{% endblock %}
