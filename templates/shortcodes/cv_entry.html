<div class="cv-entry">
  <div class="cv-meta">
    <div class="cv-date">{{ date }}</div>
    {% if logo_url %}
    <a href="{{ logo_url }}" target="_blank" rel="noopener noreferrer">
      <img src="{{ logo_img }}" alt="{{ logo_alt }}" class="cv-logo">
    </a>
    {% endif %}
  </div>
  <div class="cv-details">
    <h3>{{ title }}</h3>
    <input type="checkbox" id="{{ id }}" class="expand-toggle" hidden>
    <div class="cv-content">
      {{ body | safe }}
    </div>
    <label for="{{ id }}" class="expand-btn">
      <span class="show-more">Show more</span>
      <span class="show-less">Show less</span>
    </label>
  </div>
</div>
