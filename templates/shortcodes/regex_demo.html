<div class="regex-demo">
    <div id="regex-demo-status">Loading engine…</div>
    <div class="regex-demo-panel">
        <label class="regex-demo-label" for="pattern">Pattern</label>
        <input class="regex-demo-input" id="pattern" placeholder="(a|b)*c">
        <label class="regex-demo-label" for="input">Input string</label>
        <input class="regex-demo-input" id="input" placeholder="abababc">
        <div id="result" class="regex-demo-result">Type a pattern and input string above.</div>
    </div>
    <div class="regex-demo-examples-wrap">
        <label class="regex-demo-label">Try an example</label>
        <div class="regex-demo-examples">
        <button class="regex-demo-example-btn" data-pattern="(a|b)*" data-input="aba">(a|b)*</button>
        <button class="regex-demo-example-btn" data-pattern="a+b?" data-input="aaab">a+b?</button>
        <button class="regex-demo-example-btn" data-pattern="(ab)*c" data-input="ababc">(ab)*c</button>
        <button class="regex-demo-example-btn" data-pattern="a(b|c)*d" data-input="abcbcd">a(b|c)*d</button>
        </div>
    </div>
    <footer class="regex-demo-footnote">
        Supports literal chars, <code>|</code>, <code>*</code>, <code>+</code>, <code>?</code>, and <code>()</code> grouping.
    </footer>
</div>
<script src="{{ get_url(path='regex-demo/regex_engine.js') }}"></script>
<script src="{{ get_url(path='regex-demo/regex_demo.js') }}"></script>
